[workspace]
resolver = "2"
members = [
    "crates/spiderweb",
    "crates/spider",
    "crates/cap-source",
    "crates/cap-sink",
    "crates/cap-slow-sink",
    "crates/cap-crasher",
    "crates/cap-image",
    "tools/webctl",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
spiderweb = { path = "crates/spiderweb" }
spider = { path = "crates/spider" }
